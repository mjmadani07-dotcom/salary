name: Payroll validation

on:
  push:
    branches:
      - main
      - feat/payroll-rule-registry-engine
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run payroll regression tests
        run: bun run test

      - name: Type-check application
        run: bun run lint

      - name: Build application
        run: bun run build
